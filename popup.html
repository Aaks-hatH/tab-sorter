<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Smart Tab Sorter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <span class="app-title">Smart Tab Sorter</span>
    <div class="header-actions">
      <button id="focusBtn" class="icon-btn" title="Move distractions into a collapsed Later group">◐</button>
      <button id="tidyNowBtn" class="primary-btn compact" title="Organize and remove safe duplicate tabs">✦ Tidy</button>
      <button id="sortNowBtn" class="icon-btn" title="Sort current window now">⟲</button>
    </div>
  </header>

  <nav class="tabbar">
    <button class="tabbtn active" data-tab="live">Live</button>
    <button class="tabbtn" data-tab="sessions">Sessions</button>
    <button class="tabbtn" data-tab="archive">Closed</button>
    <button class="tabbtn" data-tab="settings">Settings</button>
  </nav>

  <main>
    <section id="panel-live" class="panel active">
      <div class="search-wrap">
        <input id="tabSearchInput" type="search" placeholder="Search every tab, session, or closed page…" autocomplete="off" />
        <div id="searchResults" class="search-results"></div>
      </div>
      <div id="insights" class="insights" aria-live="polite"></div>
      <div id="liveGroups"></div>
    </section>

    <section id="panel-sessions" class="panel">
      <div class="row">
        <input id="sessionNameInput" type="text" placeholder="Session name (optional)" />
        <button id="saveSessionBtn" class="primary-btn">Save current</button>
      </div>
      <div id="sessionsList"></div>
    </section>

    <section id="panel-archive" class="panel">
      <div class="row">
        <span class="muted">Recently closed, auto-organized</span>
        <button id="clearArchiveBtn" class="link-btn">Clear</button>
      </div>
      <div id="archiveList"></div>
    </section>

    <section id="panel-settings" class="panel">
      <label class="setting-row">
        <span>Auto-sort tabs live</span>
        <input type="checkbox" id="autoSortEnabled" />
      </label>
      <label class="setting-row">
        <span>Use adaptive smart grouping</span>
        <input type="checkbox" id="smartGroupingEnabled" />
      </label>
      <label class="setting-row">
        <span>Auto-restore last session on browser startup</span>
        <input type="checkbox" id="autoRestoreOnStartup" />
      </label>
      <label class="setting-row">
        <span>Smartly group tabs from the same site</span>
        <input type="checkbox" id="groupSameSiteTabs" />
      </label>
      <label class="setting-row">
        <span>Discover related tabs by page topic</span>
        <input type="checkbox" id="groupRelatedTabs" />
      </label>
      <label class="setting-row">
        <span>Keep pinned tabs untouched</span>
        <input type="checkbox" id="ignorePinnedTabs" />
      </label>
      <label class="setting-row">
        <span>Automatically close duplicate tabs</span>
        <input type="checkbox" id="autoArchiveDuplicates" />
      </label>
      <label class="setting-row">
        <span>Move distracting tabs to Focus “Later”</span>
        <input type="checkbox" id="focusDistractionsEnabled" />
      </label>
      <label class="setting-row">
        <span>Collapse the Focus “Later” group</span>
        <input type="checkbox" id="autoCollapseFocusGroup" />
      </label>
      <label class="setting-row">
        <span>Mark unused tabs as stale after</span>
        <select id="staleTabDays"><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option><option value="60">60 days</option></select>
      </label>
      <label class="setting-row">
        <span>Minimum size for smart groups</span>
        <select id="minimumSmartGroupSize"><option value="2">2 tabs</option><option value="3">3 tabs</option><option value="4">4 tabs</option></select>
      </label>
      <label class="setting-row">
        <span>Auto-save snapshot every</span>
        <select id="autoSaveIntervalMinutes">
          <option value="5">5 min</option>
          <option value="10">10 min</option>
          <option value="15">15 min</option>
          <option value="30">30 min</option>
          <option value="60">60 min</option>
        </select>
      </label>
      <p class="muted small">Custom domain → category rules live in the extension's Options page (right-click the toolbar icon → Options).</p>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
