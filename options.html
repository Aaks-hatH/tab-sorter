<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Smart Tab Sorter — Options</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #1c1e26;
      color: #e7e8ec;
      max-width: 560px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 { font-size: 18px; margin-bottom: 4px; }
    p.sub { color: #9296a3; font-size: 13px; margin-top: 0; }
    .rule-row {
      display: grid;
      grid-template-columns: 1fr 1fr 110px 32px;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    input, select {
      background: #262933;
      border: 1px solid #363a47;
      color: #e7e8ec;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 13px;
      width: 100%;
    }
    button {
      background: #7c85f2;
      color: #14151b;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    button.remove {
      background: none;
      border: 1px solid #363a47;
      color: #e2705f;
      padding: 4px;
    }
    .header-row {
      display: grid;
      grid-template-columns: 1fr 1fr 110px 32px;
      gap: 8px;
      color: #9296a3;
      font-size: 11px;
      margin-bottom: 6px;
    }
    #status { color: #7c85f2; font-size: 12px; margin-left: 10px; }
    .actions { margin-top: 16px; display: flex; align-items: center; }
  </style>
</head>
<body>
  <h1>Smart Tab Sorter — Custom Rules</h1>
  <p class="sub">Domain rules here are checked before the built-in categories. One domain per row, e.g. <code>news.ycombinator.com</code>.</p>

  <div class="header-row">
    <span>Domain contains</span>
    <span>Category name</span>
    <span>Color</span>
    <span></span>
  </div>
  <div id="rulesList"></div>

  <div class="actions">
    <button id="addRuleBtn">+ Add rule</button>
    <button id="saveBtn" style="margin-left:8px;">Save</button>
    <span id="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
